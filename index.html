
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f90094"><meta name="description" content="Tap into positivity with Zeke for Mr. Freshman."><title>No Filter. Just Zeke. | Mr. Freshman</title>
<style>

*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#ff83cc 0,transparent 30%),radial-gradient(circle at 85% 85%,#ffd75a 0,transparent 30%),linear-gradient(145deg,#fff5fd 0%,#dce9ff 100%);display:flex;justify-content:center;align-items:center;padding:25px 15px}

<body><main><div class="crown" aria-hidden="true">👑</div><h1>NO FILTER.<br>JUST ZEKE.</h1><p class="sub">ZEKE FOR MR. FRESHMAN</p><p class="tag">✨ Remove the Filters • 2026 ✨</p><p class="intro">A little positivity can go a long way. Tap below for a message made for your moment.</p><div id="message" class="message" role="status" aria-live="polite">Your positivity starts here. 💖</div><button id="tap" type="button">✨ TAP FOR POSITIVITY ✨</button><p class="small">Tap again whenever you need another boost.</p><div class="spark" aria-hidden="true">💗 ⭐ 💙</div><footer>REMOVE THE FILTERS • VOTE ZEKE • 2026</footer></main>
<script>
const messages = ["You belong here. Exactly as you are.", "Your voice matters. Use it with confidence.", "Progress counts, even when it's small.", "You don't need a filter to shine.", "Your kindness can change someone's day.", "Take up space. Your dreams deserve it.", "You are more than one difficult moment.", "Be proud of how far you've come.", "Your story is still being written.", "You can start fresh at any moment.", "Your differences make you powerful.", "Keep showing up for yourself.", "You are capable of more than you think.", "It's okay to ask for help.", "One brave step can change everything.", "Your future is full of possibilities.", "Don't compare your chapter one to someone else's chapter ten.", "Being yourself is your superpower.", "You are worthy of good things.", "Choose progress over perfection.", "Your energy can lift a room.", "Someone is glad you're here.", "You deserve to feel seen and heard.", "Be the reason someone smiles today.", "Big dreams begin with small moves.", "You've survived every hard day so far.", "Give yourself credit for trying.", "There is strength in being kind.", "You don't have to have it all figured out.", "Confidence grows every time you try.", "Your potential isn't limited by today's mood.", "You are allowed to grow and change.", "Keep your head up and your heart open.", "The world needs your unique perspective.", "You can make a difference right now.", "A setback is not your whole story.", "Celebrate the little wins.", "You deserve friendships that feel like sunshine.", "You bring something special to this campus.", "Lead with empathy. It matters.", "It's cool to care about people.", "Don't dim your light to fit in.", "Your best is enough for today.", "Every new day is a new opportunity.", "Choose courage over fear, one step at a time.", "You can be both a work in progress and amazing.", "Your presence makes a difference.", "Believe in the person you're becoming.", "Good vibes start with genuine kindness.", "No filter. Just you. And that's enough."];
let last = -1;
document.getElementById('tap').addEventListener('click',()=>{
let index;
if(messages.length===1){index=0}else{do{index=Math.floor(Math.random()*messages.length)}while(index===last)}
last=index;document.getElementById('message').textContent=messages[index];
});
</script></body></html>
